x-spark-build: &spark-build
  context: ..
  dockerfile: spark/Dockerfile
  args:
    SPARK_VERSION: ${SPARK_VERSION}
    ICEBERG_VERSION: ${ICEBERG_VERSION}
    POSTGRES_JDBC_VERSION: ${POSTGRES_JDBC_VERSION}

x-airflow-common: &airflow-common
  build:
    context: ..
    dockerfile: airflow/Dockerfile
    args:
      AIRFLOW_VERSION: ${AIRFLOW_VERSION}
      AIRFLOW_SPARK_PROVIDER_VERSION: ${AIRFLOW_SPARK_PROVIDER_VERSION}
      SPARK_VERSION: ${SPARK_VERSION}
      ICEBERG_VERSION: ${ICEBERG_VERSION}
      POSTGRES_JDBC_VERSION: ${POSTGRES_JDBC_VERSION}
      DEEQU_VERSION: ${DEEQU_VERSION}
      PYDEEQU_COMMIT: ${PYDEEQU_COMMIT}
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-common-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_POSTGRES_USER}:${AIRFLOW_POSTGRES_PASSWORD}@airflow-postgres:5432/${AIRFLOW_POSTGRES_DB}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d:ro

  simulator:
    build:
      context: ../simulator
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - --data-dir
      - /data/olist-ecommerce/raw
      - --dsn
      - postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - --chunk-size
      - "${SIMULATOR_CHUNK_SIZE}"
      - --speed
      - "0"
    volumes:
      - ../data:/data:ro

  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: >-
        INTERNAL://:29092,
        CONTROLLER://:29093,
        EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: >-
        INTERNAL://kafka:29092,
        EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        INTERNAL:PLAINTEXT,
        CONTROLLER:PLAINTEXT,
        EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data

  schema-registry:
    image: apicurio/apicurio-registry:3.3.0
    ports:
      - "8081:8080"
    environment:
      APICURIO_STORAGE_KIND: kafkasql
      APICURIO_KAFKASQL_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_started

  connect:
    image: debezium/connect:2.7.3.Final
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: olist-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      ENABLE_APICURIO_CONVERTERS: "true"
    depends_on:
      kafka:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:8083/connectors || exit 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  debezium-init:
    image: alpine:3.22
    depends_on:
      connect:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./debezium:/config:ro
    command:
      - /bin/sh
      - -c
      - |
        apk add --no-cache curl gettext

        envsubst \
          < /config/postgres-connector.json.template \
          > /tmp/postgres-connector.json

        curl -i -X PUT \
          -H "Content-Type: application/json" \
          --data @/tmp/postgres-connector.json \
          http://connect:8083/connectors/olist-postgres-connector/config
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: olist-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: olist-connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083
    depends_on:
      kafka:
        condition: service_started
      connect:
        condition: service_healthy

  silo:
    image: pgsty/silo:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${ADMIN_USER}
      MINIO_ROOT_PASSWORD: ${ADMIN_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - silo_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:9000/minio/health/live || exit 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  silo-init:
    image: pgsty/mc:latest
    environment:
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      LAKEHOUSE_USER: ${LAKEHOUSE_USER}
      LAKEHOUSE_PASSWORD: ${LAKEHOUSE_PASSWORD}
      ANALYTICS_USER: ${ANALYTICS_USER}
      ANALYTICS_PASSWORD: ${ANALYTICS_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://silo:9000 "$${ADMIN_USER}" "$${ADMIN_PASSWORD}" &&
        mc mb --ignore-existing local/bronze &&
        mc mb --ignore-existing local/silver &&
        mc mb --ignore-existing local/gold &&
        mc mb --ignore-existing local/checkpoints &&
        (mc admin user add local "$${LAKEHOUSE_USER}" "$${LAKEHOUSE_PASSWORD}" || true) &&
        mc admin policy attach local readwrite --user "$${LAKEHOUSE_USER}" &&
        (mc admin user add local "$${ANALYTICS_USER}" "$${ANALYTICS_PASSWORD}" || true) &&
        mc admin policy attach local readonly --user "$${ANALYTICS_USER}"
    depends_on:
      silo:
        condition: service_healthy
    restart: "no"

  iceberg-rest:
    image: apache/iceberg-rest-fixture:latest
    ports:
      - "8181:8181"
    environment:
      AWS_ACCESS_KEY_ID: ${LAKEHOUSE_USER}
      AWS_SECRET_ACCESS_KEY: ${LAKEHOUSE_PASSWORD}
      AWS_REGION: sa-east-1
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://silo:9000
      CATALOG_WAREHOUSE: s3://bronze/
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    depends_on:
      silo-init:
        condition: service_completed_successfully

  catalog-init:
    image: curlimages/curl:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for ns in bronze silver gold; do
          curl -i -X POST \
            -H "Content-Type: application/json" \
            -d "{\"namespace\":[\"$${ns}\"],\"properties\":{\"location\":\"s3://$${ns}/\"}}" \
            http://iceberg-rest:8181/v1/namespaces
        done
    depends_on:
      iceberg-rest:
        condition: service_healthy
    restart: "no"

  spark-master:
    build: *spark-build
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
    ports:
      - "7077:7077"
      - "8082:8080"
    environment:
      SPARK_NO_DAEMONIZE: "true"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    cpus: 1.0
    mem_limit: 1g

  spark-worker:
    build: *spark-build
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
      AWS_ACCESS_KEY_ID: ${LAKEHOUSE_USER}
      AWS_SECRET_ACCESS_KEY: ${LAKEHOUSE_PASSWORD}
      AWS_REGION: sa-east-1
    depends_on:
      - spark-master
    volumes:
      - ../spark/jobs:/opt/spark/jobs:ro
    cpus: 2.0
    mem_limit: 2500m

  trino:
    image: trinodb/trino:483
    ports:
      - "8084:8080"
    environment:
      LAKEHOUSE_USER: ${LAKEHOUSE_USER}
      LAKEHOUSE_PASSWORD: ${LAKEHOUSE_PASSWORD}
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
    depends_on:
      iceberg-rest:
        condition: service_healthy

  lakehouse-init:
    image: trinodb/trino:483
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for layer in bronze silver gold; do
          for file in /ddl/"$${layer}"/*.sql; do
            [ -e "$${file}" ] || continue

            echo "Applying $${file}"

            trino \
              --server http://trino:8080 \
              --file "$${file}" ||
              exit 1
          done
        done
    volumes:
      - ./init/lakehouse:/ddl:ro
    depends_on:
      catalog-init:
        condition: service_completed_successfully
      trino:
        condition: service_healthy
    restart: "no"

  airflow-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${AIRFLOW_POSTGRES_DB}
      POSTGRES_USER: ${AIRFLOW_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_POSTGRES_USER} -d ${AIRFLOW_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - airflow_pgdata:/var/lib/postgresql/data

  airflow-init:
    <<: *airflow-common
    command: version
    environment:
      <<: *airflow-common-environment
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      _AIRFLOW_WWW_USER_EMAIL: ${AIRFLOW_ADMIN_EMAIL}
    depends_on:
      airflow-postgres:
        condition: service_healthy
    restart: "no"

  airflow-api-server:
    <<: *airflow-common
    command: api-server
    ports:
      - "${AIRFLOW_PORT}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-postgres:
        condition: service_healthy

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    environment:
      <<: *airflow-common-environment
      AIRFLOW_CONN_SPARK_DEFAULT: spark://spark-master:7077?deploy-mode=client&spark-binary=spark-submit
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SPARK_VERSION: ${SPARK_VERSION}
      LAKEHOUSE_USER: ${LAKEHOUSE_USER}
      LAKEHOUSE_PASSWORD: ${LAKEHOUSE_PASSWORD}
      AWS_ACCESS_KEY_ID: ${LAKEHOUSE_USER}
      AWS_SECRET_ACCESS_KEY: ${LAKEHOUSE_PASSWORD}
      AWS_REGION: sa-east-1
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_healthy
      airflow-postgres:
        condition: service_healthy
      spark-master:
        condition: service_healthy
      lakehouse-init:
        condition: service_completed_successfully
    volumes:
      - ../airflow/dags:/opt/airflow/dags:ro
      - ../spark/jobs:/opt/spark/jobs:ro

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --hostname \"$${HOSTNAME}\""]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_healthy
      airflow-postgres:
        condition: service_healthy
    volumes:
      - ../airflow/dags:/opt/airflow/dags:ro

volumes:
  pgdata:
  kafka_data:
  silo_data:
  airflow_pgdata:
