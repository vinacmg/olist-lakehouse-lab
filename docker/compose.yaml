services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d:ro

  simulator:
    build:
      context: ../simulator
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - --data-dir
      - /data/olist-ecommerce/raw
      - --dsn
      - postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - --chunk-size
      - "${SIMULATOR_CHUNK_SIZE}"
      - --speed
      - "0"
    volumes:
      - ../data:/data:ro

  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: >-
        INTERNAL://:29092,
        CONTROLLER://:29093,
        EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: >-
        INTERNAL://kafka:29092,
        EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        INTERNAL:PLAINTEXT,
        CONTROLLER:PLAINTEXT,
        EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data

  schema-registry:
    image: apicurio/apicurio-registry:3.3.0
    ports:
      - "8081:8080"
    environment:
      APICURIO_STORAGE_KIND: kafkasql
      APICURIO_KAFKASQL_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_started

  connect:
    image: debezium/connect:2.7.3.Final
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: olist-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      ENABLE_APICURIO_CONVERTERS: "true"
    depends_on:
      kafka:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:8083/connectors || exit 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  debezium-init:
    image: alpine:3.22
    depends_on:
      connect:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./debezium:/config:ro
    command:
      - /bin/sh
      - -c
      - |
        apk add --no-cache curl gettext

        envsubst \
          < /config/postgres-connector.json.template \
          > /tmp/postgres-connector.json

        curl -i -X PUT \
          -H "Content-Type: application/json" \
          --data @/tmp/postgres-connector.json \
          http://connect:8083/connectors/olist-postgres-connector/config
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: olist-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: olist-connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083
    depends_on:
      kafka:
        condition: service_started
      connect:
        condition: service_healthy

  silo:
    image: pgsty/silo:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${SILO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${SILO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - silo_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:9000/minio/health/live || exit 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  silo-init:
    image: pgsty/mc:latest
    environment:
      SILO_ROOT_USER: ${SILO_ROOT_USER}
      SILO_ROOT_PASSWORD: ${SILO_ROOT_PASSWORD}
      LAKEHOUSE_SILO_USER: ${LAKEHOUSE_SILO_USER}
      LAKEHOUSE_SILO_PASSWORD: ${LAKEHOUSE_SILO_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://silo:9000 "$${SILO_ROOT_USER}" "$${SILO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/bronze &&
        mc mb --ignore-existing local/silver &&
        mc mb --ignore-existing local/gold &&
        mc mb --ignore-existing local/checkpoints &&
        (mc admin user add local "$${LAKEHOUSE_SILO_USER}" "$${LAKEHOUSE_SILO_PASSWORD}" || true) &&
        mc admin policy attach local readwrite --user "$${LAKEHOUSE_SILO_USER}"
    depends_on:
      silo:
        condition: service_healthy
    restart: "no"

  iceberg-rest:
    image: apache/iceberg-rest-fixture:latest
    ports:
      - "8181:8181"
    environment:
      AWS_ACCESS_KEY_ID: ${LAKEHOUSE_SILO_USER}
      AWS_SECRET_ACCESS_KEY: ${LAKEHOUSE_SILO_PASSWORD}
      AWS_REGION: sa-east-1
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://silo:9000
      CATALOG_WAREHOUSE: s3://bronze/
    depends_on:
      silo-init:
        condition: service_completed_successfully

  catalog-init:
    image: curlimages/curl:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for ns in bronze silver gold; do
          curl -i -X POST \
            -H "Content-Type: application/json" \
            -d "{\"namespace\":[\"$${ns}\"],\"properties\":{\"location\":\"s3://$${ns}/\"}}" \
            http://iceberg-rest:8181/v1/namespaces
        done
    depends_on:
      iceberg-rest:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
  kafka_data:
  silo_data:
